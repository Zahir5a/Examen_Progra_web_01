<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Surco Discos · Pago en cuotas</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Surco Discos</h1>
    </header>

    <main>
        <section class="cuotas">
            <h2>Calculadora de cuotas</h2>

            <label for="precio">Precio del disco (S/)</label>
            <input type="number" id="precio" min="0" step="0.01" placeholder="89.00">

            <label for="cantidad">Cantidad de discos</label>
            <input type="number" id="cantidad" min="1" step="1" placeholder="1">

            <label for="cuotas">Número de cuotas</label>
            <select id="cuotas">
                <option value="1">Pago único (1 cuota)</option>
                <option value="3">3 cuotas sin interés</option>
                <option value="6">6 cuotas sin interés</option>
            </select>

            <button onclick="calcular()" type="button" id="btnCalcular">Calcular cuotas</button>

            <div id="resultado" class="resultado">
                Complete los datos y presione «Calcular cuotas».
            </div>
        </section>
    </main>
</body>
</html>
